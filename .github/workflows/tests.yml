name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-22.04: setup-python still ships 3.8 there; pyproject promises >=3.8
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q
